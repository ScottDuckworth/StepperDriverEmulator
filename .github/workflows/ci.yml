name: CI Presubmit Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-host-tests:
    name: Lint & Host Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate README.md (LaTeX syntax & CLI sync)
        run: python scripts/validate_readme.py

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential

      - name: Configure host tests
        run: cmake --preset host-test-ninja

      - name: Build host tests
        run: cmake --build --preset host-test-ninja

      - name: Run host tests
        run: |
          if ! ctest --preset host-test-ninja --output-on-failure; then
            echo "### :x: Host Unit Tests Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            if [ -f build/host-test-ninja/Testing/Temporary/LastTest.log ]; then
              cat build/host-test-ninja/Testing/Temporary/LastTest.log >> $GITHUB_STEP_SUMMARY
            fi
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "::error::Host tests failed. Check step summary for full details."
            exit 1
          fi
          echo "### :white_check_mark: All Host Unit Tests Passed" >> $GITHUB_STEP_SUMMARY

  firmware-build:
    name: ARM Cortex-M0 Firmware Build & Sizing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ninja & CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake

      - name: Set up ARM GCC Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1

      - name: Configure Release firmware
        run: cmake --preset Release

      - name: Build Release firmware
        run: cmake --build --preset Release -v

      - name: Validate Flash & RAM sizing constraints
        run: |
          echo "### Firmware Memory Constraints" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python scripts/check_firmware_size.py build/Release/StepperDriverEmulator.elf | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
