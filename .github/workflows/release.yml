name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-ubuntu:
    name: Build Firmware & Linux/Windows Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Validate README.md (LaTeX syntax & CLI sync)
        run: python scripts/validate_readme.py

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential

      - name: Configure host tests
        run: cmake --preset host-test-ninja

      - name: Build host tests
        run: cmake --build --preset host-test-ninja

      - name: Run host tests
        run: ctest --preset host-test-ninja --output-on-failure

      - name: Set up ARM GCC Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '14.3.Rel1'

      - name: Configure Release firmware
        run: cmake --preset Release

      - name: Build Release firmware
        run: cmake --build --preset Release -v

      - name: Validate Flash & RAM sizing constraints
        run: python scripts/check_firmware_size.py build/Release/StepperDriverEmulator.elf

      - name: Verify no disallowed floating-point or 64-bit division symbols
        run: python scripts/check_disallowed_symbols.py build/Release/StepperDriverEmulator.elf

      - name: Prepare release assets directory
        run: mkdir -p assets

      - name: Copy firmware binaries
        run: |
          cp build/Release/StepperDriverEmulator.bin assets/
          cp build/Release/StepperDriverEmulator.hex assets/
          cp build/Release/StepperDriverEmulator.elf assets/

      - name: Cross-compile Go flasher executables (Windows & Linux)
        run: |
          GOOS=windows GOARCH=amd64 go build -o assets/flasher-windows-amd64.exe ./cmd/flasher
          GOOS=linux GOARCH=amd64 go build -o assets/flasher-linux-amd64 ./cmd/flasher

      - name: Upload Ubuntu build assets
        uses: actions/upload-artifact@v4
        with:
          name: assets-ubuntu
          path: assets/*

  build-macos:
    name: Build macOS Flasher Assets
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build macOS flasher executables
        run: |
          mkdir -p assets
          # Native Apple Silicon (ARM64)
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -o assets/flasher-darwin-arm64 ./cmd/flasher

          # Intel Mac (x86_64) via Apple Clang cross-target flag
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 CC="clang -target x86_64-apple-macos10.13" go build -o assets/flasher-darwin-amd64 ./cmd/flasher

          chmod +x assets/flasher-darwin-*

      - name: Upload macOS build assets
        uses: actions/upload-artifact@v4
        with:
          name: assets-macos
          path: assets/*

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-ubuntu, build-macos]
    permissions:
      contents: write

    steps:
      - name: Download all release assets
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: List collected release assets
        run: ls -la release_assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
